# ВНИМАНИЕ: это не рабочий файл, а заготовка для копирования.
#
# Git не может сам записывать файлы в .github/workflows — токену нужно
# отдельное право (scope "workflow"), которого у него нет. Поэтому текст
# ниже вставляется вручную через сайт GitHub:
#
#   репозиторий → .github/workflows/main.yml → карандаш → выделить всё →
#   вставить это → Commit changes
#
name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Хостинг reg.ru принимает SFTP (тот же доступ, что в FileZilla), обычный
      # FTP на нём логин не принимает. lftp умеет зеркалить папку по SFTP и,
      # в отличие от rsync, не требует ничего установленного на стороне сервера.
      # Если путь окажется неверным, следующий шаг упадёт с «No such file».
      # Этот шаг заранее показывает, куда мы попадаем при входе и что там лежит,
      # чтобы правильный путь был виден прямо в логе, без угадывания.
      - name: Показать, куда подключились
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u \"$USER_NAME\",\"$PASSWORD\" sftp://$HOST;
            echo '--- домашний каталог при входе ---';
            pwd;
            ls;
            echo '--- пробуем зайти в $REMOTE_DIR ---';
            cd \"$REMOTE_DIR\" && pwd && ls;
          " || echo "не удалось зайти в $REMOTE_DIR — смотрите список выше"

      - name: Залить по SFTP
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set sftp:auto-confirm yes;
            open -u \"$USER_NAME\",\"$PASSWORD\" sftp://$HOST;
            mirror --reverse --delete --verbose --parallel=2 \
              --no-perms \
              --ignore-time \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .vscode/ \
              --exclude-glob .claude/ \
              --exclude-glob tools/ \
              --exclude-glob .DS_Store \
              --exclude-glob README.md \
              --exclude-glob DEPLOY.md \
              --exclude-glob '*.mp4' \
              --exclude-glob 'api/config.local.php' \
              --exclude-glob 'private/*' \
              --exclude-glob 'data/motors.json' \
              --exclude-glob 'media/motors/*' \
              ./ \"$REMOTE_DIR\"
          "

      # Первый проход сравнивает файлы только по размеру (--ignore-time), иначе
      # каждый деплой перезаливал бы 130 МБ фотографий: git выдаёт всем файлам
      # свежее время изменения, и по времени они всегда «новее» серверных.
      #
      # Но у сравнения по размеру есть дыра. В HTML прописана версия стилей
      # вида style.css?v=6a9b2b17 — ровно восемь символов. Когда меняется
      # только она, размер файла не меняется ни на байт, и lftp считает файл
      # тем же самым. Правки вёрстки молча не доезжали до сайта.
      #
      # Поэтому текстовые папки заливаем вторым проходом, уже по времени:
      # они весят копейки, и перезаливать их каждый раз ничего не стоит.
      # Удаление лишнего сделал первый проход, здесь --delete не нужен.
      - name: Долить страницы и скрипты
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set sftp:auto-confirm yes;
            open -u \"$USER_NAME\",\"$PASSWORD\" sftp://$HOST;
            mirror --reverse --verbose --no-perms --no-recursion \
              --include-glob '*.html' --include-glob '*.txt' --include-glob '*.xml' \
              ./ \"$REMOTE_DIR\";
            mirror --reverse --verbose --no-perms css/ \"$REMOTE_DIR/css\";
            mirror --reverse --verbose --no-perms js/ \"$REMOTE_DIR/js\";
            mirror --reverse --verbose --no-perms panel/ \"$REMOTE_DIR/panel\";
            mirror --reverse --verbose --no-perms \
              --exclude-glob 'config.local.php' api/ \"$REMOTE_DIR/api\";
            mirror --reverse --verbose --no-perms \
              --exclude-glob 'motors.json' data/ \"$REMOTE_DIR/data\";
          "
